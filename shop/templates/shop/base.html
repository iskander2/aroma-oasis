<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AROMA OASIS{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #f5f0e6;
            min-height: 100vh;
        }

        a {
            color: #e8dfce;
            text-decoration: none;
            transition: 0.3s;
        }

        a:hover {
            color: #d6b879;
        }

        header {
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #383329;
            background: #111;
        }

        .logo {
            color: #d6b879;
            font-size: 27px;
            letter-spacing: 5px;
            font-weight: 300;
        }

        nav {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav form {
            margin: 0;
        }

        button {
            background: #c4a66a;
            color: #17130c;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        button:hover {
            background: #e0c58c;
        }

        .hero {
            text-align: center;
            padding: 90px 20px;
            background: linear-gradient(135deg, #171510, #292216);
        }

        .infinity {
            color: #d6b879;
            font-size: 55px;
        }

        .hero h1 {
            font-size: 48px;
            letter-spacing: 9px;
            color: #d6b879;
            margin: 15px 0;
        }

        .hero p {
            color: #c9bfae;
            letter-spacing: 3px;
        }

        .catalog {
            padding: 60px 7%;
        }

        .catalog h2 {
            text-align: center;
            font-size: 30px;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 25px;
        }

        .product {
            min-width: 0;
            background: #1c1b18;
            border: 1px solid #393329;
            padding: 25px;
            border-radius: 5px;
            text-align: center;
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-5px);
            border-color: #b99b60;
        }

        .product h3 {
            color: #e2c78f;
            margin-bottom: 18px;
            font-size: 21px;
        }

        /* Фотографии товаров в каталоге */
        .product img {
            display: block;
            width: 100%;
            max-width: 200px;
            height: 200px;
            object-fit: contain;
            margin: 0 auto 15px;
        }

        .product-link {
            display: block;
        }

        .price {
            font-size: 19px;
            margin: 15px 0;
        }

        .stock {
            color: #aaa18f;
            margin-bottom: 20px;
        }

        .empty {
            text-align: center;
            color: #c9bfae;
        }

        /* Общие формы */

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            margin: 8px 0 18px;
            background: #171614;
            color: #f5f0e6;
            border: 1px solid #51452f;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #d6b879;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        label {
            color: #d6b879;
        }

        /* Общие страницы */

        .page-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 35px;
            background: #1c1b18;
            border: 1px solid #393329;
        }

        .page-title {
            text-align: center;
            color: #d6b879;
            letter-spacing: 3px;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .gold-text {
            color: #d6b879;
        }

        .message {
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #51452f;
            color: #e2c78f;
        }

        footer {
            text-align: center;
            padding: 35px;
            border-top: 1px solid #383329;
            color: #c4a66a;
            letter-spacing: 2px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .hero h1 {
                font-size: 30px;
                letter-spacing: 5px;
            }

            .page-container {
                margin: 20px 12px;
                padding: 20px;
            }

            .catalog {
                padding: 35px 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="{% url 'home' %}" class="logo">
        AROMA OASIS
    </a>

    <nav>
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'cart_detail' %}">Корзина</a>

        {% if user.is_authenticated %}
            <a href="{% url 'profile' %}">Мой профиль</a>
            <a href="{% url 'my_orders' %}">Мои заказы</a>

            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    AROMA OASIS — НЕЖНОСТЬ В КАЖДОЙ КАПЛЕ
</footer>

</body>
</html>
